<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>∆</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: #000;
      color: #d0d0d0;
      font-family: 'Share Tech Mono', monospace;
      overflow: hidden;
      user-select: none;
    }

    .scanlines {
      position: fixed;
      inset: 0;
      z-index: 50;
      pointer-events: none;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 3px,
        rgba(0,0,0,0.22) 3px,
        rgba(0,0,0,0.22) 4px
      );
    }
    .scan-beam {
      position: fixed;
      left: 0; right: 0;
      height: 3px;
      background: rgba(255,255,255,0.03);
      z-index: 51;
      pointer-events: none;
      animation: beam 6s linear infinite;
    }
    @keyframes beam {
      0%   { top: -3px; }
      100% { top: 100vh; }
    }
    #noteCanvas {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
    }
    .stage {
      position: relative;
      z-index: 10;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
    }
    .symbol-wrap {
      position: relative;
      width: 180px;
      height: 180px;
      margin-bottom: 2.5rem;
      animation: pulse 4s ease-in-out infinite;
    }

    @keyframes pulse {
      0%,100% { filter: brightness(1) drop-shadow(0 0 8px rgba(255,255,255,0.08)); }
      50%      { filter: brightness(1.1) drop-shadow(0 0 18px rgba(255,255,255,0.18)); }
    }

    .symbol-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      border-radius: 50%;
      animation: symbolglitch 12s step-end infinite;
    }

    @keyframes symbolglitch {
      0%,93%,100% { filter: none; transform: translate(0,0); }
      94% { filter: brightness(2) invert(0.1); transform: translate(-2px,1px); }
      95% { filter: none; transform: translate(0,0); }
      96% { filter: brightness(1.5); transform: translate(2px,-1px); }
      97% { filter: none; transform: translate(0,0); }
    }

    .message {
      text-align: center;
      margin-bottom: 2.5rem;
      line-height: 2;
    }

    .message .line1 {
      font-size: 11px;
      color: #3a3a3a;
      letter-spacing: 0.3em;
      text-transform: uppercase;
    }

    .message .line2 {
      font-size: 13px;
      color: #666;
      letter-spacing: 0.12em;
      margin-top: 0.4rem;
    }

    .message .line3 {
      font-size: 10px;
      color: #2a2a2a;
      letter-spacing: 0.2em;
      margin-top: 0.6rem;
      animation: flicker 5s step-end infinite;
    }

    .message .line4 {
      font-size: 11px;
      color: #444;
      letter-spacing: 0.15em;
      margin-top: 0.5rem;
      font-style: italic;
    }

    @keyframes flicker {
      0%,100% { opacity: 1; }
      20% { opacity: 0; }
      21% { opacity: 1; }
      55% { opacity: 0.4; }
      56% { opacity: 1; }
    }
    @keyframes flicker2 {
      0%,100% { opacity: 1; }
      10% { opacity: 0.2; }
      11% { opacity: 1; }
      40% { opacity: 0; }
      41% { opacity: 1; }
      70% { opacity: 0.5; }
      71% { opacity: 1; }
    }
    @keyframes flicker3 {
      0%,100% { opacity: 1; }
      33% { opacity: 0; }
      34% { opacity: 0.7; }
      35% { opacity: 0; }
      36% { opacity: 1; }
      80% { opacity: 0.3; }
      81% { opacity: 1; }
    }
    @keyframes flicker4 {
      0%,100% { opacity: 1; }
      5%  { opacity: 0.1; }
      6%  { opacity: 1; }
      60% { opacity: 0; }
      61% { opacity: 1; }
      90% { opacity: 0.4; }
      91% { opacity: 1; }
    }
    .fw { display: inline-block; }
    .f1 { animation: flicker  3s step-end infinite; }
    .f2 { animation: flicker2 4.5s step-end infinite; }
    .f3 { animation: flicker3 6s step-end infinite; }
    .f4 { animation: flicker4 7s step-end infinite; }

    .player {
      width: min(420px, calc(100vw - 3rem));
      border-top: 1px solid #1e1e1e;
      padding-top: 1.2rem;
    }

    .player-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .player-header .track-id {
      font-size: 10px;
      color: #333;
      letter-spacing: 0.2em;
    }

    .player-header .status {
      font-size: 10px;
      color: #333;
      letter-spacing: 0.15em;
    }

    .player-header .status.playing {
      color: #888;
      animation: blink 1.2s step-end infinite;
    }

    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

    .waveform {
      height: 36px;
      margin-bottom: 1rem;
      display: flex;
      align-items: flex-end;
      gap: 2px;
      overflow: hidden;
    }

    .waveform .bar {
      flex: 1;
      background: #1e1e1e;
      transition: height 0.1s;
      min-height: 2px;
    }

    .waveform.active .bar {
      background: #444;
      animation: waveani var(--dur, 0.5s) ease-in-out infinite alternate;
    }

    @keyframes waveani {
      from { height: var(--low, 4px); }
      to   { height: var(--high, 20px); }
    }

    .progress-wrap {
      position: relative;
      height: 1px;
      background: #1a1a1a;
      margin-bottom: 0.6rem;
      cursor: pointer;
    }

    .progress-fill {
      height: 100%;
      background: #555;
      width: 0%;
      transition: width 0.3s linear;
      pointer-events: none;
    }

    .progress-wrap:hover .progress-fill { background: #888; }

    .time-row {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: #2e2e2e;
      letter-spacing: 0.1em;
      margin-bottom: 1.2rem;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .ctrl-btn {
      background: transparent;
      border: 1px solid #1e1e1e;
      color: #555;
      font-family: inherit;
      font-size: 10px;
      letter-spacing: 0.15em;
      padding: 5px 14px;
      cursor: pointer;
      text-transform: uppercase;
      transition: border-color 0.2s, color 0.2s;
    }

    .ctrl-btn:hover { border-color: #555; color: #aaa; }
    .ctrl-btn.active { border-color: #444; color: #ccc; }

    .vol-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
    }

    .vol-label {
      font-size: 9px;
      color: #2a2a2a;
      letter-spacing: 0.15em;
    }

    input[type=range].vol-slider {
      -webkit-appearance: none;
      width: 70px;
      height: 1px;
      background: #2a2a2a;
      outline: none;
      cursor: pointer;
    }

    input[type=range].vol-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 8px;
      height: 8px;
      background: #555;
      border-radius: 0;
      cursor: pointer;
    }

    input[type=range].vol-slider:hover { background: #444; }

    

    .corner {
      position: fixed;
      font-size: 10px;
      color: #1a1a1a;
      letter-spacing: 0.1em;
      line-height: 1.9;
      z-index: 20;
      pointer-events: none;
    }
    .corner.tl { top: 1.2rem; left: 1.5rem; }
    .corner.br { bottom: 1.2rem; right: 1.5rem; text-align: right; }

    .hidden {
      color: #000;
      font-size: 10px;
      letter-spacing: 0.1em;
      margin-top: 0.8rem;
      text-align: center;
      user-select: text;
    }
  </style>
</head>

<script>
const canvas = document.getElementById('noteCanvas');
const ctx    = canvas.getContext('2d');

function resize() {
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

const NOTES = ['♩','♪','♫','♬','𝅗𝅥','𝅘𝅥𝅮','𝅘𝅥𝅯'];
const particles = [];

function spawnNote() {
  particles.push({
    x:       Math.random() * canvas.width,
    y:       Math.random() * canvas.height,
    char:    NOTES[Math.floor(Math.random() * NOTES.length)],
    angle:   (Math.random() - 0.5) * Math.PI * 2,
    size:    10 + Math.random() * 22,
    alpha:   0,
    phase:   'in',
    life:    0,
    maxLife: 120 + Math.random() * 180,
    drift:   (Math.random() - 0.5) * 0.3,
    rise:    -(0.2 + Math.random() * 0.4),
  });
}

setInterval(spawnNote, 400);

function drawNotes() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life++;
    p.x += p.drift;
    p.y += p.rise;

    const half = p.maxLife * 0.25;
    if (p.life < half) {
      p.alpha = p.life / half * 0.35;
    } else {
      p.alpha = (1 - (p.life - half) / (p.maxLife - half)) * 0.35;
    }

    if (p.life >= p.maxLife) { particles.splice(i, 1); continue; }

    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.angle);
    ctx.globalAlpha = p.alpha;
    ctx.fillStyle = '#ffffff';
    ctx.font = `${p.size}px serif`;
    ctx.fillText(p.char, 0, 0);
    ctx.restore();
  }

  requestAnimationFrame(drawNotes);
}
drawNotes();
const waveform = document.getElementById('waveform');
const BAR_COUNT = 48;
for (let i = 0; i < BAR_COUNT; i++) {
  const b = document.createElement('div');
  b.className = 'bar';
  const low  = (2 + Math.random() * 6) + 'px';
  const high = (8 + Math.random() * 24) + 'px';
  const dur  = (0.3 + Math.random() * 0.6).toFixed(2) + 's';
  b.style.setProperty('--low',  low);
  b.style.setProperty('--high', high);
  b.style.setProperty('--dur',  dur);
  b.style.animationDelay = (Math.random() * 0.5).toFixed(2) + 's';
  b.style.height = low;
  waveform.appendChild(b);
}

const playBtn     = document.getElementById('playBtn');
const stopBtn     = document.getElementById('stopBtn');
const volSlider   = document.getElementById('volSlider');
const progressWrap= document.getElementById('progressWrap');
const progressFill= document.getElementById('progressFill');
const timeCur     = document.getElementById('timeCur');
const timeTot     = document.getElementById('timeTot');
const trackId     = document.getElementById('trackId');
const statusLabel = document.getElementById('statusLabel');

audio.volume = 0.8;
let loaded = true;

function fmt(s) {
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60).toString().padStart(2, '0');
  return `${m}:${sec}`;
}

function setPlaying(yes) {
  waveform.classList.toggle('active', yes);
  playBtn.classList.toggle('active', yes);
  playBtn.textContent = yes ? 'pause' : 'play';
  statusLabel.textContent = yes ? '▮ playing' : 'stopped';
  statusLabel.className = 'status' + (yes ? ' playing' : '');
}

playBtn.addEventListener('click', () => {
  if (!loaded) return;
  if (audio.paused) { audio.play(); setPlaying(true); }
  else              { audio.pause(); setPlaying(false); }
});

stopBtn.addEventListener('click', () => {
  audio.pause();
  audio.currentTime = 0;
  setPlaying(false);
  progressFill.style.width = '0%';
  timeCur.textContent = '0:00';
});

volSlider.addEventListener('input', () => { audio.volume = volSlider.value; });

audio.addEventListener('timeupdate', () => {
  if (!audio.duration) return;
  const pct = (audio.currentTime / audio.duration) * 100;
  progressFill.style.width = pct + '%';
  timeCur.textContent = fmt(audio.currentTime);
});

audio.addEventListener('loadedmetadata', () => {
  timeTot.textContent = fmt(audio.duration);
});

audio.addEventListener('ended', () => setPlaying(false));

progressWrap.addEventListener('click', (e) => {
  if (!loaded || !audio.duration) return;
  const rect = progressWrap.getBoundingClientRect();
  const ratio = (e.clientX - rect.left) / rect.width;
  audio.currentTime = ratio * audio.duration;
});


  document.getElementById('dlBtn').addEventListener('click', () => {
    const a = document.createElement('a');
    a.href = audio.src;
    a.download = 'transmission_.wav';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  });
</script>
